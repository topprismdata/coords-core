[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coords-core"
version = "0.1.0"
description = "Single source of truth for China coordinate conversions (WGS-84/GCJ-02/BD-09) and frame discipline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TopPrism", email = "wp03@topprism.local" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["coords_core"]
